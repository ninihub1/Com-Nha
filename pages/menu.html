<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu | Cơm Nhà Restaurant</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/menu.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body data-partial-prefix="../">

  <div id="site-header"></div>

  <main class="menu-page">

    <div class="menu-banner">[ banner photo ]</div>

    <section class="menu-hero">
      <p class="eyebrow">Our Menu</p>
      <h1>The full table</h1>
      <p>Every dish is cooked to order from three generations of family recipes. [V] denotes a vegetarian option.</p>
    </section>

    <section class="order-panel" aria-labelledby="order-title">
      <p class="eyebrow">Order online</p>
      <h2 id="order-title">Ready to order?</h2>
      <fieldset class="order-choice">
        <legend class="sr-only">How would you like your order?</legend>
        <label class="order-option">
          <input type="radio" name="order-type" value="pickup" checked>
          <span><svg class="order-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Pickup</span>
        </label>
        <label class="order-option">
          <input type="radio" name="order-type" value="delivery">
          <span><svg class="order-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17l3-7h5l4 7M9 10l-1-3H5M14 10l-1.5-3H15"/></svg>Delivery</span>
        </label>
      </fieldset>
      <p class="order-note" id="order-note" aria-live="polite"></p>
      <div class="order-actions">
        <a class="btn btn-primary" data-site-link="orderUrl" href="#">Order now</a>
        <a class="btn btn-outline order-uber" data-site-link="uberEatsUrl" href="#" hidden>Order on Uber Eats</a>
      </div>
    </section>

    <nav class="menu-nav" id="menu-nav" aria-label="Menu categories"></nav>

    <div id="menu-sections">
      <p class="menu-status">Loading menu…</p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../js/config.js"></script>
  <script src="../js/include.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/order-chooser.js"></script>
    <script src="../js/nav.js"></script>
</body>
</html>
